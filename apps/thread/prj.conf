CONFIG_NETWORKING=y
CONFIG_NET_IPV6=y
CONFIG_NET_IPV4=n
CONFIG_NET_UDP=y

# OpenThread: a minimal Thread device that joins an existing network from its
# dataset (`ot dataset set active <hex>`), started from the shell.
CONFIG_NET_L2_OPENTHREAD=y
CONFIG_OPENTHREAD_MTD=y
CONFIG_OPENTHREAD_MANUAL_START=y
CONFIG_OPENTHREAD_SHELL=y
# shortcut: settings in RAM, so the dataset is entered again after each boot;
# flash settings once the ring stops around their writes (doc/thread.md, M5).
CONFIG_OPENTHREAD_SETTINGS_RAM=y
# OpenThread's PSA keys (network key, PSKc) are persistent: the PSA ITS store
# on the settings subsystem in the storage partition. Written when a dataset is
# committed, from the shell or OpenThread thread (stacks in internal RAM).
CONFIG_FLASH=y
CONFIG_FLASH_MAP=y
CONFIG_ZMS=y
CONFIG_SETTINGS=y
CONFIG_SECURE_STORAGE_ITS_STORE_IMPLEMENTATION_SETTINGS=y

CONFIG_SHELL=y
CONFIG_NET_SHELL=y
CONFIG_LOG=y
CONFIG_LOG_MODE_DEFERRED=y
